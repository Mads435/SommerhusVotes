<title>Sommerhus-afstemning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFE3C7;
    --linen:#FBF3E4;
    --linen-dim:#E6DCC6;
    --ink:#2B2620;
    --terracotta:#C1592A;
    --olive:#5C6A3E;
    --gold:#A97A2E;
    --gold-dim:rgba(169,122,46,0.35);
    --muted:#7A6A50;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(circle at 12% 6%, rgba(255,255,255,0.5), transparent 40%),
      radial-gradient(circle at 90% 95%, rgba(193,89,42,0.10), transparent 48%);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:400;}
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:24px 20px 44px;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .brand{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:500;
    font-size:21px;
    letter-spacing:0.2px;
    color:var(--ink);
  }
  .brand span{color:var(--terracotta);}
  .link-btn{
    background:none;border:none;color:var(--gold);
    font-family:'Inter',sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;
    text-decoration:none;border-bottom:1px solid var(--gold-dim);
    cursor:pointer;opacity:0.9;padding:4px 0;
  }
  .link-btn:hover{opacity:1;border-bottom-color:var(--gold);}

  /* ---- editorial card ---- */
  .postcard{
    background:var(--linen);
    color:var(--ink);
    border-radius:2px;
    box-shadow:0 16px 34px rgba(43,38,32,0.18), 0 3px 8px rgba(43,38,32,0.10);
    position:relative;
    overflow:hidden;
    transition:transform .32s ease, opacity .32s ease;
  }
  .postcard.leaving-like{transform:translateX(115%);opacity:0;}
  .postcard.leaving-dislike{transform:translateX(-115%);opacity:0;}

  .img-wrap{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;}
  .img-wrap svg{width:100%;height:100%;display:block;}
  .img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-eyebrow{
    position:absolute;top:18px;right:20px;color:#fff;font-size:10px;letter-spacing:3px;
    font-weight:600;text-transform:uppercase;opacity:0.92;text-shadow:0 1px 4px rgba(0,0,0,0.5);
  }
  .img-tag{
    position:absolute;top:16px;left:16px;z-index:2;background:var(--ink);color:var(--linen);
    padding:5px 10px 5px 8px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;
    transform:rotate(-4deg);box-shadow:2px 3px 6px rgba(0,0,0,0.3);border-radius:1px;
  }
  .img-tag::after{
    content:"";position:absolute;left:-4px;top:50%;transform:translateY(-50%);
    width:8px;height:8px;border-radius:50%;background:var(--gold);border:1px solid var(--ink);
  }
  .bottom-links{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:auto;padding-top:14px;}
  .maplink{
    font-size:11px;letter-spacing:0.3px;color:var(--ink);text-decoration:none;
    border-bottom:1px solid var(--gold);padding-bottom:1px;font-weight:600;white-space:nowrap;
  }
  .img-nav{
    position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(43,38,32,0.5);border:none;cursor:pointer;padding:0;
  }
  .img-nav.prev{left:10px;}
  .img-nav.next{right:10px;}
  .img-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:5px;justify-content:center;}
  .img-dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.4);}
  .img-dots span.active{background:var(--gold);}
  .photo-link{
    position:absolute;right:14px;bottom:14px;background:rgba(43,38,32,0.68);color:#fff;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:600;text-decoration:none;
    padding:6px 11px;border-radius:2px;
  }
  .photo-link:hover{background:rgba(43,38,32,0.88);}
  .stamp{
    position:absolute;top:16px;right:18px;color:#fff;
    font-family:'Inter',sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;
    padding:6px 11px;background:var(--terracotta);text-transform:uppercase;
  }
  .stamp.ok{background:var(--olive);}
  .soldout-ribbon{
    position:absolute;left:-22%;width:144%;top:50%;
    transform:translateY(-50%) rotate(-26deg);
    background:var(--terracotta);color:#fff;text-align:center;
    padding:9px 0;font-family:'Inter',sans-serif;font-weight:800;
    font-size:20px;letter-spacing:5px;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
    z-index:5;pointer-events:none;
  }
  .thumb-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .thumb{position:relative;width:64px;height:64px;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb button{
    position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;
    background:rgba(43,38,32,0.8);color:#fff;border:none;font-size:11px;line-height:1;cursor:pointer;
  }
  .link-rows{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .link-row{display:flex;align-items:center;gap:8px;}
  .link-row-thumb{
    width:38px;height:38px;border-radius:4px;object-fit:cover;flex-shrink:0;
    background:var(--linen-dim);
  }
  .link-row input{flex:1;font-size:12px;padding:8px 10px;}
  .link-row-remove{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(43,38,32,0.12);color:var(--ink);font-size:12px;line-height:1;
  }

  .postcard-body{padding:26px 24px 24px;position:relative;display:flex;flex-direction:column;min-height:250px;}
  .postcard-body::before{
    content:"";position:absolute;inset:8px;border:1px solid var(--gold-dim);pointer-events:none;
  }
  .house-name{font-family:'Fraunces',serif;font-weight:400;font-size:23px;margin:0 0 8px;line-height:1.2;letter-spacing:0.2px;min-height:2.4em;}
  .rule{width:34px;height:1px;background:var(--gold);margin:0 0 10px;}
  .house-loc{font-size:12px;color:var(--muted);margin:0;letter-spacing:0.3px;}
  .price-line{
    margin:16px 0;padding:12px 0;
    border-top:1px solid var(--gold-dim);border-bottom:1px solid var(--gold-dim);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .price-line .price-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
  .price-line .price-amt{font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:var(--terracotta);}
  .house-meta{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px;}
  .chip{
    font-size:11px;color:var(--olive);font-weight:600;letter-spacing:0.6px;text-transform:uppercase;
  }
  .chip.gold{color:var(--gold);}
  .house-link{
    display:inline-block;font-size:11px;letter-spacing:1px;text-transform:uppercase;
    color:var(--ink);text-decoration:none;font-weight:600;
    border-bottom:1px solid var(--gold);padding-bottom:2px;
  }

  /* ---- buttons ---- */
  .vote-actions{display:flex;gap:12px;margin-top:22px;}
  .vote-btn{
    flex:1;padding:14px 0;border:1px solid var(--ink);background:none;
    font-family:'Inter',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    cursor:pointer;color:var(--ink);transition:transform .12s ease, background .15s ease;
  }
  .vote-btn:active{transform:scale(0.97);}
  .vote-btn.dislike{background:none;}
  .vote-btn.like{background:var(--olive);color:var(--linen);border-color:var(--olive);}
  .vote-btn .icon{display:none;}

  .primary-btn{
    background:var(--gold);color:var(--ink);border:none;border-radius:2px;
    padding:14px 20px;font-family:'Inter',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;width:100%;margin-top:10px;
  }
  .secondary-btn{
    background:none;border:1px solid var(--gold-dim);color:var(--ink);border-radius:2px;
    padding:12px 20px;font-family:'Inter',sans-serif;font-weight:600;font-size:11px;
    letter-spacing:1px;text-transform:uppercase;cursor:pointer;width:100%;margin-top:10px;
  }
  .danger-btn{
    background:none;border:1px solid var(--terracotta);color:var(--terracotta);border-radius:2px;
    padding:9px 14px;font-family:'Inter',sans-serif;font-weight:600;font-size:11px;
    letter-spacing:0.6px;text-transform:uppercase;cursor:pointer;
  }

  /* ---- name picker ---- */
  .fam-list{display:flex;flex-direction:column;gap:8px;margin-top:22px;}
  .fam-btn{
    background:var(--linen);border:1px solid rgba(43,38,32,0.12);color:var(--ink);
    border-radius:2px;padding:15px 18px;font-size:15px;font-family:'Fraunces',serif;font-weight:400;
    text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
    transition:border-color .15s ease;box-shadow:0 2px 6px rgba(43,38,32,0.06);
  }
  .fam-btn:hover{border-color:var(--gold);}
  .check{color:var(--gold);font-size:16px;}

  .center-msg{
    text-align:center;margin-top:60px;
  }
  .center-msg .emoji{font-size:40px;display:block;margin-bottom:12px;}
  .progress-note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;opacity:0.9;}

  /* ---- closed screen ---- */
  .rose-frame{
    margin-top:28px;border:1px solid var(--gold-dim);border-radius:2px;
    padding:36px 18px;text-align:center;background:var(--linen);
  }
  .rose-frame img{max-width:100%;border-radius:2px;display:none;}

  /* ---- admin ---- */
  .admin-card{background:var(--linen);border:1px solid rgba(43,38,32,0.08);
    border-radius:2px;padding:16px 18px;margin-bottom:12px;box-shadow:0 2px 6px rgba(43,38,32,0.05);}
  .admin-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px solid rgba(43,38,32,0.08);font-size:14px;}
  .admin-row:last-child{border-bottom:none;}
  label{display:block;font-size:11px;letter-spacing:0.6px;text-transform:uppercase;color:var(--muted);margin:12px 0 5px;}
  input,textarea,select{
    width:100%;background:#fff;color:var(--ink);border:1px solid rgba(43,38,32,0.15);border-radius:2px;
    padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;
  }
  textarea{min-height:70px;resize:vertical;}
  .tab-row{display:flex;gap:6px;margin-bottom:16px;}
  .tab{flex:1;text-align:center;padding:10px 0;border:1px solid rgba(43,38,32,0.15);background:var(--linen);
    font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;cursor:pointer;color:var(--muted);}
  .tab.active{background:var(--gold);color:#fff;border-color:var(--gold);}
  .rank{font-family:'Fraunces',serif;font-style:italic;color:var(--gold);width:26px;display:inline-block;}
  .small{font-size:11px;color:var(--muted);letter-spacing:0.3px;}
</style>
</head>

/* ---------------- STORAGE HELPERS (GitHub-backed) ---------------- */
function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }

// UTF-8 safe base64 helpers (house names etc. contain æøå, so plain
// btoa/atob would break on the non-ASCII characters).
function b64Encode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_, p1) => String.fromCharCode("0x" + p1)));
}
function b64Decode(str){
  return decodeURIComponent(atob(str).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
}

async function ghGet(){
  try{
    const res = await fetch(GITHUB_API, {
      headers: { "Authorization": "Bearer " + GITHUB_TOKEN, "Accept": "application/vnd.github+json" }
    });
    if(res.status === 404) return { data: null, sha: null };
    if(!res.ok){ console.error("GitHub GET failed", res.status, await res.text()); return { data: null, sha: null, error: true }; }
    const json = await res.json();
    const content = b64Decode(json.content.replace(/\n/g, ""));
    return { data: JSON.parse(content), sha: json.sha };
  }catch(e){
    console.error("GitHub GET error", e);
    return { data: null, sha: null, error: true };
  }
}
async function ghPut(dataObj, sha, message){
  try{
    const body = { message: message || "Update sommerhus data", content: b64Encode(JSON.stringify(dataObj)) };
    if(sha) body.sha = sha;
    const res = await fetch(GITHUB_API, {
      method: "PUT",
      headers: {
        "Authorization": "Bearer " + GITHUB_TOKEN,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    if(res.status === 409) return { ok: false, conflict: true };
    if(!res.ok){ console.error("GitHub PUT failed", res.status, await res.text()); return { ok: false }; }
    const json = await res.json();
    return { ok: true, sha: json.content.sha };
  }catch(e){
    console.error("GitHub PUT error", e);
    return { ok: false };
  }
}
function defaultState(){
  return { houses: SEED_HOUSES, votes: emptyVotesBlob(), importedSeedIds: SEED_HOUSES.map(h => h.id) };
}
// Read-modify-write with retry on conflicts (two people saving at once).
// `mutate` always receives the FRESHEST state fetched right before saving,
// so a slow local edit can never clobber someone else's concurrent vote —
// as long as each mutator only touches the field(s) it's responsible for.
async function ghUpdate(mutate, message){
  for(let attempt = 0; attempt < 4; attempt++){
    const { data, sha, error } = await ghGet();
    if(error){ await delay(500 * (attempt + 1)); continue; }
    const current = data || defaultState();
    const updated = mutate(current);
    const result = await ghPut(updated, sha, message);
    if(result.ok){
      houses = updated.houses;
      votesBlob = updated.votes;
      importedSeedIds = new Set(updated.importedSeedIds || []);
      return true;
    }
    if(!result.conflict){ await delay(500 * (attempt + 1)); continue; }
    // conflict — someone else saved in between; loop and retry with fresh data
  }
  return false;
}
// Clicking through several houses quickly fires off several ghUpdate() calls
// almost at once. Left to run concurrently, they race each other for the
// same file and repeatedly hit 409 Conflict. Routing every write through
// this queue makes them run one at a time, in order, from this browser —
// so a fast clicker never collides with themselves. Different families
// saving around the same time is still rare enough for ghUpdate's built-in
// conflict retry to handle on its own.
let writeQueue = Promise.resolve();
function queueGhUpdate(mutate, message){
  const result = writeQueue.then(() => ghUpdate(mutate, message));
  writeQueue = result.catch(() => {}); // keep the chain alive even if one write fails
  return result;
}
async function refreshState(){
  const { data } = await ghGet();
  if(data){
    houses = data.houses || houses;
    votesBlob = data.votes || votesBlob;
    importedSeedIds = new Set(data.importedSeedIds || [...importedSeedIds]);
  }
}
async function loadState(){
  const result = await ghGet();
  if(result.data){
    houses = result.data.houses || SEED_HOUSES;
    votesBlob = result.data.votes || emptyVotesBlob();
    importedSeedIds = new Set(result.data.importedSeedIds || []);
  }else if(!result.error){
    // A confirmed 404 (no error) means the file genuinely doesn't exist
    // yet — safe to seed it for the very first time.
    const seeded = defaultState();
    const ok = await ghUpdate(() => seeded, "Initial seed");
    if(!ok){
      houses = SEED_HOUSES;
      votesBlob = emptyVotesBlob();
      importedSeedIds = new Set(SEED_HOUSES.map(h => h.id));
    }
  }else{
    // A real error (bad/expired token, network issue, GitHub outage) —
    // this must NEVER be treated as "file is empty", or it would silently
    // overwrite (and destroy) everyone's real votes. Retry once, and if
    // that still fails, fall back to a read-only, unsaved local view for
    // this session — nothing gets written to GitHub in this branch.
    await delay(800);
    const retry = await ghGet();
    if(retry.data){
      houses = retry.data.houses || SEED_HOUSES;
      votesBlob = retry.data.votes || emptyVotesBlob();
      importedSeedIds = new Set(retry.data.importedSeedIds || []);
    }else{
      houses = SEED_HOUSES;
      votesBlob = emptyVotesBlob();
      importedSeedIds = new Set(SEED_HOUSES.map(h => h.id));
      console.warn("Could not reach GitHub (bad token or network issue) — showing local data for this session only. Nothing was overwritten remotely. Reload once the token/connection is fixed.");
    }
  }
  FAMILIES.forEach((_, i) => { if(!votesBlob[famId(i)]) votesBlob[famId(i)] = {}; });
}

// Seed houses not yet in the saved list. Only added when the admin
// explicitly clicks "Importér" — never automatically.
function getPendingImport(){
  const existingIds = new Set(houses.map(h => h.id));
  return SEED_HOUSES.filter(h => !existingIds.has(h.id) && !importedSeedIds.has(h.id));
}
async function importNewHouses(){
  const missing = getPendingImport();
  if(!missing.length) return;
  await ghUpdate(draft => {
    draft.houses = draft.houses.concat(missing);
    draft.importedSeedIds = [...new Set([...(draft.importedSeedIds || []), ...missing.map(h => h.id)])];
    return draft;
  }, "Import new houses");
  render();
}

// All 6 families' votes live under one "votes" field in the same file.
let votesBlob = null; // {f1:{houseId:'like'|'dislike',...}, f2:{...}, ...}
function emptyVotesBlob(){

  FAMILIES.forEach((_, i) => { b[famId(i)] = {}; });
  return b;
}

async function confirmFamilyLogin(){
  const input = document.getElementById("fam-code");
  const errEl = document.getElementById("fam-login-err");
  if(!input) return;
  const idx = pendingFamIdx;
  const st = getAttemptState(idx);
  if(input.value !== FAMILY_CODES[idx]){
    st.count++;
    if(st.count >= MAX_LOGIN_ATTEMPTS){
      st.lockoutUntil = Date.now() + LOGIN_LOCKOUT_MS;
      st.count = 0;
      render(); // switches to the lockout view
      return;
    }
    const left = MAX_LOGIN_ATTEMPTS - st.count;
    if(errEl) errEl.textContent = `Forkert kode. ${left} forsøg tilbage.`;
    input.value = "";
    input.focus();
    return;
  }
  st.count = 0;
  st.lockoutUntil = 0;
  pendingFamIdx = null;
  currentFamId = famId(idx);
  currentFamName = FAMILIES[idx];
  currentVotes = votesBlob[currentFamId] || {};
  voteOrder = shuffle(houses.map(h => h.id));
  goToVotingOrDone();
}
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function orderedHouses(){
  // Falls back to the natural order if no shuffle has been generated yet
  // (e.g. voteOrder references a house that's since been removed by admin).
  const byId = new Map(houses.map(h => [h.id, h]));
  const ordered = (voteOrder || []).map(id => byId.get(id)).filter(Boolean);
  houses.forEach(h => { if(!voteOrder.includes(h.id)) ordered.push(h); });
  return ordered.length ? ordered : houses;
}
function goToVotingOrDone(){
  if(new Date() > VOTE_DEADLINE){ screen = "closed"; render(); return; }
  const next = orderedHouses().find(h => !(h.id in currentVotes));
  if(next){ screen = "vote"; }
  else{ screen = "done"; }
  render();
}

  currentFamId = null; currentFamName = null; currentVotes = {}; pendingFamIdx = null; isAdmin = false; voteOrder = [];
  goToNameOrClosed();

let pendingConfirm = null; // {message, onYes}

  const div = document.createElement("div");
  div.id = "confirm-overlay";
  div.style.cssText = "position:fixed;inset:0;background:rgba(43,38,32,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;";
  div.innerHTML = `

      <div style="display:flex;gap:10px;">
        <button class="secondary-btn" style="margin:0;border-color:rgba(43,38,32,0.2);" onclick="resolveConfirm(false)">Annullér</button>
        <button class="primary-btn" style="margin:0;" onclick="resolveConfirm(true)">Bekræft</button>
      </div>
    </div>`;
  document.body.appendChild(div);
}
function hideConfirmOverlay(){
  const el = document.getElementById("confirm-overlay");
  if(el) el.remove();
}
function resolveConfirm(yes){
  const cb = pendingConfirm && pendingConfirm.onYes;
  pendingConfirm = null;
  hideConfirmOverlay();
  if(yes && cb) cb();
}

function castVote(houseId, value){
  currentVotes[houseId] = value;
  votesBlob[currentFamId] = currentVotes; // optimistic local update, instant UI
  const famId_ = currentFamId;
  queueGhUpdate(draft => {
    draft.votes = draft.votes || emptyVotesBlob();
    draft.votes[famId_] = {...(draft.votes[famId_] || {}), [houseId]: value};
    return draft;
  }, `Vote ${famId_}: ${houseId}=${value}`); // queued — never races other clicks
  goToVotingOrDone();
}

  const photoUrls = formPhotoUrls.map(s => s.trim()).filter(Boolean);
  const id = editingHouseId || ("h" + Date.now());
  const newHouseData = {id, name, link, location, rooms, rating, price, art, soldOut, photoUrls, country, sqm};

  const ok = await ghUpdate(draft => {
    draft.houses = editingHouseId
      ? draft.houses.map(h => h.id === id ? {...h, ...newHouseData} : h)
      : draft.houses.concat([newHouseData]);
    return draft;
  }, editingHouseId ? "Edit house " + id : "Add house " + id);

  if(!ok){
    if(errEl) errEl.textContent = "Kunne ikke gemme lige nu (kunne ikke nå GitHub). Prøv igen om lidt — intet er gemt endnu.";

/* ---------------- RENDER HELPERS ---------------- */
function stars(r){
  if(r === null || r === undefined) return "Ikke vurderet";
  return "★".repeat(Math.round(r)) + "☆".repeat(5-Math.round(r));
}
function imageBlock(house, opts){
  opts = opts || {};
  const stampHtml = opts.stamp ? `<div class="stamp ${opts.stamp==='like'?'ok':''}">${opts.stamp==='like'?'Elsket':'Nej tak'}</div>` : "";
  const eyebrow = opts.eyebrow ? `<div class="img-eyebrow">${opts.eyebrow}</div>` : "";
  const countryTag = house.country ? `<div class="img-tag">${house.country}</div>` : "";
  const uploaded = house.images && house.images.length;
  const imgs = uploaded ? house.images : ((house.photoUrls && house.photoUrls.length) ? house.photoUrls : []);
  if(imgs.length){
    const idx = (imgIdx[house.id] || 0) % imgs.length;
    const nav = imgs.length > 1 ? `
      <button class="img-nav prev" onclick="event.stopPropagation();nextImage('${house.id}',-1,${imgs.length})">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
      <button class="img-nav next" onclick="event.stopPropagation();nextImage('${house.id}',1,${imgs.length})">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>` : "";
    const dots = imgs.length > 1 ? `<div class="img-dots">${imgs.map((_,i)=>`<span class="${i===idx?'active':''}"></span>`).join("")}</div>` : "";
    // Uploaded photos always work (no network fetch). Remote hotlinked URLs
    // might still be blocked by the source site — if so, fall back to the
    // illustration for that house instead of a broken image icon.
    const onerrorAttr = uploaded ? "" : ` onerror="this.onerror=null;this.outerHTML=sceneSVG('${house.art}')"`;
    const swipeAttrs = imgs.length > 1
      ? ` ontouchstart="handleSwipeStart(event)" ontouchend="handleSwipeEnd(event,'${house.id}',${imgs.length})"`
      : "";
    return `<div class="img-wrap"${swipeAttrs}>
        <img src="${imgs[idx]}" alt="${house.name}"${onerrorAttr}>
        ${countryTag}${eyebrow}${nav}${dots}${stampHtml}
      </div>`;
  }
  return `<div class="img-wrap">
      ${sceneSVG(house.art)}
      ${countryTag}${eyebrow}
      <a class="photo-link" href="${house.link}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Se billeder ↗</a>
      ${stampHtml}
    </div>`;
}
function nextImage(houseId, dir, total){
  const cur = imgIdx[houseId] || 0;
  imgIdx[houseId] = (cur + dir + total) % total;
  render();
}
let swipeStartX = null, swipeStartY = null;
function handleSwipeStart(e){
  const t = e.changedTouches[0];
  swipeStartX = t.clientX;
  swipeStartY = t.clientY;
}
function handleSwipeEnd(e, houseId, total){
  if(swipeStartX === null) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - swipeStartX;
  const dy = t.clientY - swipeStartY;
  swipeStartX = null; swipeStartY = null;
  // Ignore mostly-vertical drags (the person is scrolling the page).
  if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
    nextImage(houseId, dx < 0 ? 1 : -1, total);
  }
}
function metaChips(house){
  const sizePart = house.sqm ? `${house.sqm} m² · ` : "";
  return `<div class="house-meta">
    <span class="chip">${sizePart}${house.rooms ?? "?"} værelser</span>
    <span class="chip gold">${stars(house.rating)}</span>
  </div>`;
}

/* ---------------- SCREENS ---------------- */
function render(){
  if(screen === "loading"){ app.innerHTML = `<p class="center-msg">Indlæser…</p>`; return; }
  if(screen === "name") return renderName();
  if(screen === "tokenSetup") return renderTokenSetup();
  if(screen === "familyLogin") return renderFamilyLogin();
  if(screen === "vote") return renderVote();
  if(screen === "done") return renderDone();
  if(screen === "review") return renderReview();
  if(screen === "closed") return renderClosed();
  if(screen === "adminLogin") return renderAdminLogin();
  if(screen === "admin") return renderAdmin();
}

function renderTokenSetup(){
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">🏡 Sommerhus<span>-afstemning</span></div>
    </div>
    <div class="center-msg" style="margin-top:40px;">
      <h2 class="display" style="margin-bottom:10px;">Første opsætning</h2>
      <p style="color:var(--muted);font-size:14px;">Denne enhed har ikke gemt adgangskoden til at hente/gemme data endnu. Indsæt den herunder — du får den af Mads. Det er kun nødvendigt denne ene gang på hver enhed.</p>
    </div>
    <label>Adgangskode</label>
    <input id="token-input" type="password" autocomplete="off">
    <p id="token-err" style="color:var(--terracotta);font-size:13px;min-height:16px;margin:8px 0 0;"></p>
    <button class="primary-btn" onclick="saveTokenManually()">Gem og fortsæt</button>
  `;
  const input = document.getElementById("token-input");
  input.focus();
  input.addEventListener("keydown", e => { if(e.key === "Enter") saveTokenManually(); });
}
function saveTokenManually(){
  const input = document.getElementById("token-input");
  const val = input.value.trim();
  const errEl = document.getElementById("token-err");
  if(!val){
    if(errEl) errEl.textContent = "Indsæt venligst adgangskoden.";
    return;
  }
  localStorage.setItem(TOKEN_STORAGE_KEY, val);
  GITHUB_TOKEN = val;
  init();
}

    <div class="topbar">

      <button class="link-btn" onclick="screen='adminLogin';render()">Admin</button>
    </div>
    <p style="color:var(--muted);font-size:14px;margin-top:0;">Vælg jeres navn for at like eller dislike husene. I kan ændre jeres stemmer indtil <b>26. august</b>.</p>
    <div class="fam-list">

function renderFamilyLogin(){
  const name = FAMILIES[pendingFamIdx];
  const st = getAttemptState(pendingFamIdx);
  const now = Date.now();
  if(st.lockoutUntil > now){
    const minsLeft = Math.ceil((st.lockoutUntil - now) / 60000);
    app.innerHTML = `
      <div class="topbar">
        <button class="link-btn" onclick="screen='name';pendingFamIdx=null;render()">&larr; Tilbage</button>
      </div>
      <div class="center-msg" style="margin-top:50px;">
        <span class="emoji">⏳</span>
        <h2 class="display" style="margin-bottom:6px;">${name}</h2>
        <p style="color:var(--muted);font-size:14px;">For mange forkerte forsøg. Prøv igen om ca. ${minsLeft} minut${minsLeft===1?"":"ter"}.</p>
      </div>
    `;
    return;
  }
  app.innerHTML = `
    <div class="topbar">
      <button class="link-btn" onclick="screen='name';pendingFamIdx=null;render()">&larr; Tilbage</button>
    </div>
    <div class="center-msg" style="margin-top:50px;">
      <h2 class="display" style="margin-bottom:6px;">${name}</h2>
      <p style="color:var(--muted);font-size:14px;">Indtast jeres kode for at stemme.</p>
    </div>
    <label>Kode</label>
    <input id="fam-code" type="password" autocomplete="off">
    <p id="fam-login-err" style="color:var(--terracotta);font-size:13px;min-height:16px;margin:8px 0 0;"></p>
    <button class="primary-btn" onclick="confirmFamilyLogin()">Log ind</button>
  `;
  const input = document.getElementById("fam-code");
  input.focus();
  input.addEventListener("keydown", e => { if(e.key === "Enter") confirmFamilyLogin(); });
}

function renderVote(){
  const order = orderedHouses();
  const house = order.find(h => !(h.id in currentVotes));
  if(!house){ screen="done"; render(); return; }
  const votedCount = Object.keys(currentVotes).length;
  const num = order.findIndex(h=>h.id===house.id) + 1;
  app.innerHTML = `
    <div class="topbar">
      <button class="link-btn" onclick="backToStart()">&larr; Skift familie</button>
      <span class="small">${votedCount+1} / ${houses.length}</span>
    </div>
    <div class="postcard" id="card">
      ${house.soldOut ? '<div class="soldout-ribbon">UDSOLGT</div>' : ""}
      ${imageBlock(house, {eyebrow:`Hus ${String(num).padStart(2,"0")} / ${String(houses.length).padStart(2,"0")}`})}
      <div class="postcard-body">
        <h2 class="house-name">${house.name}</h2>
        <div class="rule"></div>
        <p class="house-loc">${house.location||""}</p>
        <div class="price-line">
          <span class="price-label">Pris pr. par</span>
          <span class="price-amt">${house.price ? Number(house.price).toLocaleString("da-DK") + " kr" : "Se hjemmeside"}</span>
        </div>
        ${metaChips(house)}
        <div class="bottom-links">
          <a class="house-link" href="${house.link}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Se hele opslaget ↗</a>
          <a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(house.location||house.name)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">📍 Kort ↗</a>
        </div>
      </div>
    </div>
    <div class="vote-actions">
      <button class="vote-btn dislike" onclick="voteAnim('${house.id}','dislike')">Nej tak</button>
      <button class="vote-btn like" onclick="voteAnim('${house.id}','like')">Elsker det</button>
    </div>
  `;
}
function voteAnim(houseId, value){
  const card = document.getElementById("card");
  if(card){ card.classList.add(value === "like" ? "leaving-like" : "leaving-dislike"); }
  setTimeout(()=>castVote(houseId, value), 260);
}

function renderDone(){
  app.innerHTML = `
    <div class="topbar">
      <button class="link-btn" onclick="backToStart()">&larr; Skift familie</button>
    </div>
    <div class="center-msg">
      <span class="emoji">🥂</span>
      <h2 class="display" style="margin-bottom:6px;">Alle huse gennemgået</h2>
      <p style="color:var(--muted);font-size:14px;">Tak for jeres stemmer, ${currentFamName}. I kan ændre jeres valg indtil <b>26. august</b>.</p>
      <button class="primary-btn" onclick="screen='review';render()">Se og ret jeres svar</button>
    </div>
  `;
}

function renderReview(){
  app.innerHTML = `
    <div class="topbar">
      <button class="link-btn" onclick="screen='done';render()">&larr; Tilbage</button>
      <span class="small">Alle huse</span>
    </div>
    ${orderedHouses().map((house,i) => {
      const v = currentVotes[house.id];
      return `<div class="postcard" style="margin-bottom:18px;">
        ${house.soldOut ? '<div class="soldout-ribbon">UDSOLGT</div>' : ""}
        ${imageBlock(house, {stamp:v, eyebrow:`Hus ${String(i+1).padStart(2,"0")} / ${String(orderedHouses().length).padStart(2,"0")}`})}
        <div class="postcard-body">
          <h2 class="house-name">${house.name}</h2>
          <div class="rule"></div>
          <p class="house-loc">${house.location||""}</p>
          <div class="price-line">
            <span class="price-label">Pris pr. par</span>
            <span class="price-amt">${house.price ? Number(house.price).toLocaleString("da-DK") + " kr" : "Se hjemmeside"}</span>
          </div>
          ${metaChips(house)}
          <div class="bottom-links">
            <a class="house-link" href="${house.link}" target="_blank" rel="noopener noreferrer">Se hele opslaget ↗</a>
            <a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(house.location||house.name)}" target="_blank" rel="noopener noreferrer">📍 Kort ↗</a>
          </div>
          <div class="vote-actions">
            <button class="vote-btn dislike" style="${v==='dislike'?'background:var(--terracotta);color:#fff;border-color:var(--terracotta);':''}" onclick="castVoteInline('${house.id}','dislike')">Nej tak</button>
            <button class="vote-btn like" style="${v==='like'?'':'background:none;color:var(--ink);'}" onclick="castVoteInline('${house.id}','like')">Elsker det</button>
          </div>
        </div>
      </div>`;
    }).join("")}
  `;
}
function castVoteInline(houseId, value){
  currentVotes[houseId] = value;
  votesBlob[currentFamId] = currentVotes;
  const famId_ = currentFamId;
  queueGhUpdate(draft => {
    draft.votes = draft.votes || emptyVotesBlob();
    draft.votes[famId_] = {...(draft.votes[famId_] || {}), [houseId]: value};
    return draft;
  }, `Vote ${famId_}: ${houseId}=${value}`); // queued
  render();
}

function renderClosed(){

    <div class="topbar">
      <button class="link-btn" onclick="backToStart()">&larr; Skift familie</button>
      <button class="link-btn" onclick="screen='adminLogin';render()">Admin</button>
    </div>
    <div class="center-msg">
      <span class="emoji">🔒</span>
      <h2 class="display">Afstemningen er lukket</h2>
      <p style="color:var(--muted);font-size:14px;">Resultatet præsenteres til Rosé og Rejer 🥂🦐</p>
      <div class="rose-frame">
        <img id="rose-img" src="" alt="Rosé og Rejer">
        <p class="small" style="margin:0;" id="rose-fallback">🥂🦐<br>Billede tilføjes snart</p>
      </div>
    </div>
  `;

function renderAdminLogin(){
  app.innerHTML = `
    <div class="topbar">
      <button class="link-btn" onclick="backToStart()">&larr; Tilbage</button>
    </div>
    <h2 class="display">Admin-login</h2>
    <label>Brugernavn</label>
    <input id="admin-user" type="text" autocomplete="off">
    <label>Kode</label>
    <input id="admin-pass" type="password">
    <p id="admin-err" style="color:var(--terracotta);font-size:13px;min-height:16px;"></p>

  `;
  const onEnter = e => { if(e.key === "Enter") tryAdminLogin(); };

  document.getElementById("admin-pass").addEventListener("keydown", onEnter);
}

async function renderAdmin(){
  const allVotes = FAMILIES.map((_,i)=> votesBlob[famId(i)] || {});
  const results = houses.map(h=>{
    let likes=0, dislikes=0;
    allVotes.forEach(v=>{ if(v[h.id]==='like') likes++; else if(v[h.id]==='dislike') dislikes++; });
    return {...h, likes, dislikes};
  }).sort((a,b)=>b.likes-a.likes);
  const progress = FAMILIES.map((f,i)=>({name:f, count:Object.keys(allVotes[i]).length}));

  let body = "";
  if(adminTab === "results"){
    body = `
      <div class="admin-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3 style="margin:0;">Resultat (flest likes øverst)</h3>
          <button class="link-btn" onclick="refreshAdmin()">🔄 Opdatér</button>
        </div>
        ${results.map((h,i)=>`
          <div class="admin-row">
            <span><span class="rank">#${i+1}</span> ${h.name}</span>
            <span>❤ ${h.likes} &nbsp; ✕ ${h.dislikes}</span>
          </div>`).join("")}
      </div>
      <div class="admin-card">
        <h3 style="margin-top:0;">Hvem mangler at stemme</h3>
        ${progress.map(p=>`
          <div class="admin-row">
            <span>${p.name}</span>
            <span>${p.count===houses.length ? '<span class="check">✔ Færdig</span>' : p.count+" / "+houses.length}</span>
          </div>`).join("")}
      </div>
      <button class="danger-btn" onclick="resetVoting()">Nulstil alle stemmer</button>
    `;
  } else if(adminTab === "manage"){
    body = `
      <div class="admin-card">
        <h3 style="margin-top:0;">Huse i puljen (${houses.length})</h3>
        ${houses.map((h,i)=>`
          <div class="admin-row">
            <span><span class="rank">#${i+1}</span> ${h.name}${h.soldOut ? ' <span style="color:var(--terracotta);font-weight:700;font-size:11px;">· UDSOLGT</span>' : ""}</span>
            <span style="display:flex;gap:6px;">
              <button class="secondary-btn" style="width:auto;margin:0;padding:7px 12px;font-size:12px;" onclick="startEditHouse('${h.id}')">Redigér</button>
              <button class="danger-btn" onclick="removeHouse('${h.id}')">Fjern</button>
            </span>
          </div>`).join("") || '<p class="small">Ingen huse endnu.</p>'}
      </div>
    `;
  } else if(adminTab === "add" || adminTab === "edit"){
    const editing = adminTab === "edit" ? houses.find(h => h.id === editingHouseId) : null;
    const h = editing || {name:"",link:"",location:"",rooms:"",rating:"",price:"",soldOut:false};
    body = `
      <div class="admin-card">
        <h3 style="margin-top:0;">${editing ? "Redigér hus" : "Tilføj hus manuelt"}</h3>
        <p class="small">Åbn husets link i en ny fane, og indtast/ret info herunder.</p>
        <label>Navn*</label><input id="nh-name" value="${escapeAttr(h.name)}">
        <label>Link til opslag*</label><input id="nh-link" value="${escapeAttr(h.link)}">
        <label>Beliggenhed</label><input id="nh-loc" value="${escapeAttr(h.location)}">
        <label>Land</label><input id="nh-country" value="${escapeAttr(h.country)}" placeholder="Frankrig">
        <label>Størrelse (m²)</label><input id="nh-sqm" type="number" value="${h.sqm ?? ""}">
        <label>Antal værelser</label><input id="nh-rooms" type="number" value="${h.rooms ?? ""}">
        <label>Rating (0-5)</label><input id="nh-rating" type="number" step="0.5" min="0" max="5" value="${h.rating ?? ""}">
        <label>Pris pr. par (kr)</label><input id="nh-price" type="number" value="${h.price ?? ""}">
        <label style="display:flex;align-items:center;gap:8px;margin-top:16px;">
          <input id="nh-soldout" type="checkbox" style="width:auto;" ${h.soldOut ? "checked" : ""}>
          <span style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);">Udsolgt</span>
        </label>
        <label>Indsæt flere links på én gang</label>
        <textarea id="nh-bulk-links" placeholder="Ét link pr. linje – indsæt fra din browser og tryk 'Tilføj alle'"></textarea>
        <button class="secondary-btn" onclick="addManyPhotoUrls()">📋 Tilføj alle indsatte links</button>
        <label style="margin-top:18px;">Billed-links (ét pr. linje, med preview)</label>
        <div class="link-rows">
          ${formPhotoUrls.map((url,i)=>`
            <div class="link-row">
              <img class="link-row-thumb" src="${escapeAttr(url)}" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">
              <input type="text" value="${escapeAttr(url)}" placeholder="https://..." oninput="formPhotoUrls[${i}]=this.value" onchange="render()">
              <button class="link-row-remove" onclick="removePhotoUrlRow(${i})">✕</button>
            </div>
          `).join("") || '<p class="small">Ingen billed-links endnu.</p>'}
        </div>
        <button class="secondary-btn" onclick="addPhotoUrlRow()">+ Tilføj ét billed-link</button>
        <label>Illustration (vises hvis der ikke er nogen billed-links)</label>
        <select id="nh-art">
          ${Object.entries(ART_LABELS).map(([key,label])=>
            `<option value="${key}" ${(h.art||"vineyard-pool")===key?"selected":""}>${label}</option>`
          ).join("")}
        </select>
        <p id="form-error" class="small" style="color:var(--terracotta);min-height:14px;margin:12px 0 0;"></p>
        <button class="primary-btn" onclick="saveHouseFromForm()">${editing ? "Gem ændringer" : "Tilføj hus"}</button>
        ${editing ? `<button class="secondary-btn" onclick="cancelEditHouse()">Annullér</button>` : ""}
      </div>
    `;
  }

  const pending = getPendingImport();
  const importBanner = pending.length ? `
    <div class="admin-card" style="border-color:var(--gold);background:rgba(169,122,46,0.08);">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <span style="font-size:13px;">📥 <b>${pending.length}</b> nye hus${pending.length===1?"":"e"} klar til import fra koden.</span>
        <button class="primary-btn" style="width:auto;margin:0;padding:8px 14px;" onclick="importNewHouses()">Importér</button>
      </div>
      <p class="small" style="margin:8px 0 0;">Sker kun når du trykker her — jeres gemte huse og billeder rører vi aldrig automatisk.</p>
    </div>
  ` : "";

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">🏡 Admin</div>
      <button class="link-btn" onclick="backToStart()">Log ud</button>
    </div>
    ${importBanner}
    <div class="tab-row">
      <div class="tab ${adminTab==='results'?'active':''}" onclick="adminTab='results';render()">Resultat</div>
      <div class="tab ${(adminTab==='manage'||adminTab==='edit')?'active':''}" onclick="editingHouseId=null;formPhotoUrls=[];adminTab='manage';render()">Huse</div>
      <div class="tab ${adminTab==='add'?'active':''}" onclick="goToAddTab()">Tilføj</div>
    </div>
    ${body}
  `;
}
</script>
